syntax = "proto3";
package devicegateway;

message DeviceInfo {
  string id = 1;
  string hw = 2;
  string cert = 3;
}

message Job {
  string id = 1;
  string type = 2;
  string payloadUrl = 3;
  string sha256 = 4;
  string signature = 5;
}

message JobReport {
  string id = 1;
  string status = 2;
  string logs = 3;
}

service DeviceGateway {
  rpc Register(DeviceInfo) returns (Job);
  rpc Heartbeat(DeviceInfo) returns (Job);
  rpc FetchJobs(DeviceInfo) returns (stream Job);
  rpc ReportStatus(JobReport) returns (JobReport);
}
